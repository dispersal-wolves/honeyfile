[project]
name = "dispersal-honeyfile"
version = "0.1.0"
description = "Local canary-file monitoring"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
honeyfile = "honeyfile:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["honeyfile"]
package-dir = {"" = "src"}
